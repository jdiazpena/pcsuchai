[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsuchai"
version = "0.1.0"
description = "Reproducible SUCHAI-1 Langmuir probe and particle-counter post-processing"
readme = "README.md"
authors = [{name = "Joaquín Díaz"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
orbit-astropy = ["astropy>=7.2.2", "sgp4>=2.24"]
orbit-skyfield = ["skyfield>=1.49", "sgp4>=2.24"]
magnetic-aacgm = ["aacgmv2>=2.7"]
magnetic-apex = ["apexpy>=2.1.1"]
benchmark = ["psutil>=7", "threadpoolctl>=3.6"]
test = ["pytest>=8"]
local = [
  "astropy>=7.2.2",
  "sgp4>=2.24",
  "skyfield>=1.49",
  "aacgmv2>=2.7",
  "apexpy>=2.1.1",
  "psutil>=7",
  "threadpoolctl>=3.6",
  "pytest>=8",
]

[project.scripts]
pcsuchai = "pcsuchai.cli:main"

[project.urls]
Repository = "https://github.com/jdiazpena/pcsuchai"
Documentation = "https://github.com/jdiazpena/pcsuchai/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcsuchai = ["assets/*.npz", "assets/*.md", "assets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
